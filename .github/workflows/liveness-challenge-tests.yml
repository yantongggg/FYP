name: Liveness challenge unit tests

on:
  pull_request:
    paths:
      - 'backend/utils/liveness_challenge.py'
      - 'backend/tests/test_liveness_challenge.py'
      - 'backend/ml_models/liveness_detector.py'
      - 'backend/app.py'
      - '.github/workflows/liveness-challenge-tests.yml'
  push:
    branches: [fix/liveness-evaluation]

jobs:
  challenge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile affected Python sources
        run: python -m py_compile backend/app.py backend/ml_models/liveness_detector.py backend/utils/liveness_challenge.py
      - name: Challenge lifecycle unit tests
        run: python -m unittest discover -s backend/tests -p 'test_liveness_challenge.py' -v
